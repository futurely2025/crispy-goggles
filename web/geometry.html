<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الأشكال الهندسية — معادلات عربية</title>
  <link rel="stylesheet" href="css/fonts.css?v=5.7.0">
  <link rel="stylesheet" href="css/brand.css?v=5.0.0">
  <link rel="stylesheet" href="css/studio.css?v=5.0.0">
  <style>
    .tpls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .tpl { border: 1px solid #cfdcdf; background: #fff; border-radius: 9px; padding: 6px 2px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; min-height: 58px; }
    .tpl .g { font-size: 22px; line-height: 1.1; color: var(--tq-2); }
    .tpl .n { font-size: 10.5px; color: #3a5159; text-align: center; line-height: 1.25; }
    .tpl:hover { border-color: var(--tq); }
    .tpl[aria-pressed="true"] { background: var(--tq-soft); border-color: var(--tq); }
    .lbls { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; }
    .lbls .k { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .lbls .inp { height: 27px; font-family: Amiri, serif; font-size: 15px; }
    .stage .hd { cursor: grab; }
    .stage .hd:hover circle.ring { stroke-width: 3; }
  </style>
  <script src="js/core/logger.js?v=5.7.0"></script>
  <script>/* office.js blanks pages framed outside Office (PDF studio) — load it only when not embedded there */ if (!/[?&]embed=pdf\b/.test(location.search)) document.write('<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"><\/script>');</script>
  <script src="js/i18n.js?v=5.7.0"></script>
  <script src="js/studio/raster.js?v=5.4.0"></script>
  <script src="js/figures/util.js?v=5.0.0"></script>
  <script src="js/figures/registry.js?v=5.0.0"></script>
  <script src="js/studio/studio.js?v=5.2.0"></script>
  <script src="js/studio/geometry-render.js?v=5.0.0"></script>
  <script src="js/studio/geometry-templates.js?v=5.0.0"></script>
  <script src="js/figures/geometry-markup.js?v=5.0.0"></script>
</head>
<body class="studio">
  <div class="loader" id="loader">
    <svg class="arc" viewBox="0 0 120 120" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19b7b0"/><stop offset="1" stop-color="#0a7c78"/></linearGradient></defs>
      <path d="M22 70 A40 40 0 0 1 96 38" fill="none" stroke="url(#lg)" stroke-width="13" stroke-linecap="round"/>
    </svg>
    <div class="lt">جارٍ التحميل…</div>
  </div>

  <header class="st-bar">
    <div class="st-title"><span class="ico">📐</span><span data-t="الأشكال الهندسية|Geometry"></span></div>
    <div class="st-tools">
      <button type="button" class="tb" id="gridBtn" data-t="شبكة|Grid"></button>
      <button type="button" class="tb" id="fitBtn" data-t="توسيط|Center"></button>
      <span class="sep"></span>
      <button type="button" class="tb" id="exportBtn" title="تصدير">⇪</button>
    </div>
  </header>

  <main class="st-main">
    <section class="st-canvas">
      <div class="stage" id="stage"></div>
      <div class="st-status" id="status" data-t="اسحب النقاط الفيروزية لتغيير الشكل — يحافظ الشكل على خصائصه (القائمة، التطابق، التوازي…)|Drag the turquoise points — the figure keeps its properties"></div>
    </section>
    <aside class="st-side">
      <details class="st-sec" open>
        <summary data-t="الأشكال|Shapes"></summary>
        <div class="bd">
          <div class="tpls" id="tpls"></div>
          <div class="row" id="nRow" hidden style="margin-top:8px"><span class="lbl" data-t="عدد الأضلاع|Sides"></span><input type="number" class="inp num" id="nInp" min="3" max="12"></div>
        </div>
      </details>
      <details class="st-sec" open>
        <summary data-t="القياسات والعلامات|Measures & marks"></summary>
        <div class="bd">
          <div class="row"><span class="lbl" data-t="الأضلاع|Sides"></span>
            <div class="seg" id="sidesSeg"><button type="button" data-v="none" data-t="بدون|None"></button><button type="button" data-v="values" data-t="الأطوال|Lengths"></button></div></div>
          <div class="row"><span class="lbl" data-t="الزوايا|Angles"></span>
            <div class="seg" id="anglesSeg"><button type="button" data-v="none" data-t="بدون|None"></button><button type="button" data-v="marks" data-t="علامات|Marks"></button><button type="button" data-v="values" data-t="القياسات|Values"></button></div></div>
          <div class="checks" id="optChecks"></div>
          <div class="grid2" style="margin-top:8px">
            <label><span data-t="وحدة الطول|Unit"></span><input class="inp" id="unit"></label>
            <label><span data-t="المنازل العشرية|Decimals"></span><select class="inp" id="dec"><option value="0">0</option><option value="1">1</option><option value="2">2</option></select></label>
          </div>
        </div>
      </details>
      <details class="st-sec">
        <summary data-t="الأسماء والتسميات|Names & labels"></summary>
        <div class="bd">
          <div class="lbl" style="margin-bottom:4px" data-t="أسماء النقاط|Point names"></div>
          <div class="lbls" id="ptNames"></div>
          <div class="lbl" style="margin:10px 0 4px" data-t="تسمية الأضلاع (مثل ٥ سم أو س) — اتركها فارغة للتلقائي|Side labels (blank = automatic)"></div>
          <div class="lbls" id="sideLbls"></div>
          <div class="lbl" style="margin:10px 0 4px" data-t="تسمية الزوايا (مثل ٦٠° أو α) — اكتب - للإخفاء|Angle labels (- to hide)"></div>
          <div class="lbls" id="angLbls"></div>
        </div>
      </details>
      <details class="st-sec">
        <summary data-t="المظهر|Appearance"></summary>
        <div class="bd">
          <div class="grid2">
            <label><span data-t="لون الخطوط|Lines"></span><input type="color" class="inp" id="cStroke"></label>
            <label><span data-t="لون التعبئة|Fill"></span><input type="color" class="inp" id="cFill"></label>
            <label><span data-t="لون الزوايا|Angles"></span><input type="color" class="inp" id="cAccent"></label>
            <label><span data-t="سُمك الخط|Line width"></span><select class="inp" id="lw"><option value="1.4">1.4</option><option value="2">2</option><option value="2.8">2.8</option></select></label>
            <label><span data-t="شفافية التعبئة|Fill opacity"></span><select class="inp" id="fo"><option value="0">0</option><option value="0.08">8%</option><option value="0.12">12%</option><option value="0.22">22%</option><option value="0.35">35%</option></select></label>
            <label><span data-t="حجم الكتابة|Text size"></span><select class="inp" id="fsz"><option>10</option><option>11</option><option>12</option><option>14</option><option>16</option></select></label>
          </div>
          <div class="row" style="margin-top:8px"><span class="lbl" data-t="الترميز|Notation"></span>
            <div class="seg" id="notSeg"><button type="button" data-v="ar">أ ب جـ</button><button type="button" data-v="en">A B C</button></div></div>
          <div class="row"><span class="lbl" data-t="الأرقام|Digits"></span>
            <div class="seg" id="digSeg"><button type="button" data-v="eastern">١٢٣</button><button type="button" data-v="western">123</button></div></div>
          <div class="row"><span class="lbl" data-t="الخط|Font"></span><select class="inp" id="font">
            <option value="Amiri">أميري</option><option value="Noto Naskh Arabic">نوتو نسخ</option><option value="Scheherazade New">شهرزاد</option>
            <option value="Noto Kufi Arabic">نوتو كوفي</option><option value="Cairo">القاهرة</option></select></div>
        </div>
      </details>
      <details class="st-sec" id="codeSec">
        <summary data-t="الكود (LaTeX) — للدقة الكاملة|Code (LaTeX) — for full precision"></summary>
        <div class="bd"><div id="codeBox"></div></div>
      </details>
    </aside>
  </main>

  <footer class="st-foot">
    <span class="size" id="sizeInfo"></span>
    <div class="foot-btns">
      <button type="button" class="btn ghost" id="cancelBtn" data-t="إلغاء|Cancel"></button>
      <button type="button" class="btn primary" id="okBtn" data-t="إدراج الشكل|Insert figure"></button>
    </div>
  </footer>
  <div class="pop" id="exportPop" hidden><div class="menu">
    <button type="button" data-exp="copy" data-t="نسخ كصورة|Copy image"></button>
    <button type="button" data-exp="png" data-t="تنزيل PNG|Download PNG"></button>
    <button type="button" data-exp="svg" data-t="تنزيل SVG|Download SVG"></button>
  </div></div>
  <div class="toast" id="toast" hidden></div>
  <script src="js/core/userfonts.js?v=5.7.0"></script>
  <script src="js/core/fontselects.js?v=5.4.0"></script>
  <script src="js/studio/geometry.js?v=5.0.0"></script>
</body>
</html>
