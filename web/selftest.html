<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الفحص الذاتي — معادلات عربية</title>
  <script src="js/core/logger.js?v=5.7.0"></script>
  <link rel="stylesheet" href="css/fonts.css?v=5.7.0">
  <link rel="stylesheet" href="css/brand.css?v=5.2.0">
  <style>
    body { margin: 0; background: #eef3f4; font: 14px "Segoe UI", Tahoma, sans-serif; color: #1b2a30; }
    header { background: linear-gradient(180deg, #34505a, #22363d); color: #fff; padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
    header h1 { font-size: 16px; margin: 0; flex: 1; min-width: 160px; }
    header button { border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.1); color: #fff; border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; }
    header button.primary { background: #0e9f9a; border-color: #0e9f9a; }
    .sum { display: flex; gap: 8px; padding: 12px 16px; flex-wrap: wrap; }
    .sum .b { background: #fff; border-radius: 10px; padding: 8px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .sum .b b { font-size: 20px; margin-inline-end: 6px; }
    .ok b { color: #2e8b3a; } .bad b { color: #c2352b; } .run b { color: #0e9f9a; }
    .bar { height: 5px; background: #d7e3e6; margin: 0 16px; border-radius: 4px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: #0e9f9a; width: 0; transition: width .2s; }
    main { padding: 8px 16px 40px; display: flex; flex-direction: column; gap: 10px; }
    section { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); overflow: hidden; }
    section h2 { margin: 0; font-size: 14px; padding: 10px 14px; background: #f6fafb; border-bottom: 1px solid #e3ecee; display: flex; justify-content: space-between; }
    .t { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; padding: 7px 14px; border-bottom: 1px solid #f0f4f5; align-items: start; }
    .t:last-child { border-bottom: 0; }
    .t .s { font-weight: 700; }
    .t.pass .s { color: #2e8b3a; } .t.fail .s { color: #c2352b; } .t.info .s { color: #1f5fbf; } .t.wait .s { color: #9aaab0; }
    .t .d { color: #5f7179; font-size: 12px; direction: ltr; text-align: right; unicode-bidi: plaintext; word-break: break-word; }
    .t.fail .d { color: #a02820; }
    .t .ms { color: #9aaab0; font-size: 11px; }
    #log { font: 12px Consolas, monospace; white-space: pre-wrap; direction: ltr; text-align: left; padding: 10px 14px; max-height: 360px; overflow: auto; margin: 0; background: #fbfcfc; }
    .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #22363d; color: #fff; padding: 8px 16px; border-radius: 10px; z-index: 9; }
    #frames { position: fixed; left: -5000px; top: 0; width: 1100px; height: 800px; }
    #frames iframe { width: 1100px; height: 800px; border: 0; }
  </style>
</head>
<body>
  <header>
    <h1>🩺 الفحص الذاتي — معادلات عربية <span id="ver"></span></h1>
    <button class="primary" id="runBtn" type="button">▶ تشغيل الفحص</button>
    <button id="copyBtn" type="button">📋 نسخ التقرير</button>
    <button id="closeBtn" type="button" hidden>✕ إغلاق</button>
  </header>
  <div class="sum">
    <div class="b run"><b id="nDone">0</b>من <span id="nAll">0</span></div>
    <div class="b ok"><b id="nPass">0</b>ناجح</div>
    <div class="b bad"><b id="nFail">0</b>فاشل</div>
    <div class="b"><b id="nTime">0</b>ثانية</div>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <main id="out"></main>
  <main>
    <section><h2><span>سجل الأخطاء في هذا المتصفح</span><span><button id="logClear" type="button" style="border:0;background:none;color:#c2352b;cursor:pointer">مسح السجل</button></span></h2><pre id="log"></pre></section>
  </main>
  <div id="frames" aria-hidden="true"></div>
  <div class="toast" id="toast" hidden></div>

  <script src="js/i18n.js?v=5.7.0"></script>
  <script src="js/core/userfonts.js?v=5.7.0"></script>
  <script src="js/core/eqalign.js?v=5.4.1"></script>
  <script src="js/core/render-host.js?v=5.7.0"></script>
  <script src="js/studio/raster.js?v=5.4.0"></script>
  <script src="js/figures/util.js?v=5.2.0"></script>
  <script src="js/figures/registry.js?v=5.2.0"></script>
  <script src="js/core/vector.js?v=5.4.0"></script>
  <script src="js/core/look.js?v=5.2.0"></script>
  <script src="js/word/docscan.js?v=5.2.0"></script>
  <script src="js/word/latexsense.js?v=5.6.0"></script>
  <script src="js/word/bridge.js?v=5.7.0"></script>
  <script src="js/ai-format.js?v=5.2.0"></script>
  <script src="js/chem/balance.js?v=5.2.0"></script>
  <script src="js/chem/elements.js?v=5.2.0"></script>
  <script src="js/chem/chemcalc.js?v=5.2.0"></script>
  <script src="js/math/circuit-calc.js?v=5.2.0"></script>
  <script src="js/math/prob.js?v=5.2.0"></script>
  <script src="js/pdf/compose.js?v=5.2.0"></script>
  <script src="js/pdf/svg2pdf.js?v=5.2.0"></script>
  <script src="js/pdf/ui.js?v=5.2.0"></script>
  <script src="vendor/pdf-lib/pdf-lib.min.js?v=1.17.1"></script>
  <script type="module">
    import * as pdfjs from './vendor/pdfjs/pdf.min.js?v=4.10.38';
    pdfjs.GlobalWorkerOptions.workerSrc = new URL('./vendor/pdfjs/pdf.worker.min.js?v=4.10.38', location.href).href;
    window.pdfjsLib = pdfjs;
    window.dispatchEvent(new Event('pdfjs-ready'));
  </script>
  <script src="js/core/selftest.js?v=5.7.0"></script>
</body>
</html>
