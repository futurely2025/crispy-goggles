<!doctype html>
<html><head><meta charset="utf-8"><title>ArabicMath renderer</title>
<link rel="stylesheet" href="../css/fonts.css?v=5.7.0">
<script src="../js/core/render-host.js?v=5.7.0"></script>
</head><body>
<script>
RenderHost.setBase('../');
window.addEventListener('message', function (e) {
  var m = e.data && e.data.armathRender;
  if (!m || !m.id) return;
  var o = m.opts || {};
  var reply = function (x) { e.source.postMessage({ armathRender: x }, e.origin); };
  RenderHost.render(m.tex, o, o.dpi || 300).then(function (r) {
    if (r.errors && r.errors.length) return reply({ id: m.id, error: r.errors.join(' — ') });
    reply({ id: m.id, result: { svg: r.svgString, png: r.dataUrl, widthPt: r.widthPt, heightPt: r.heightPt, depthPt: r.depthPt } });
  }).catch(function (err) { reply({ id: m.id, error: String(err && err.message || err) }); });
});
RenderHost.warm('stix2').then(function () { if (window.parent !== window) window.parent.postMessage({ armathRender: { ready: true } }, '*'); });
</script>
</body></html>
