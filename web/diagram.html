<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الجداول والمخططات — معادلات عربية</title>
  <link rel="stylesheet" href="css/fonts.css?v=5.7.0">
  <link rel="stylesheet" href="css/brand.css?v=5.0.0">
  <link rel="stylesheet" href="css/studio.css?v=5.0.0">
  <style>
    .dtypes { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .dtypes button { border: 1px solid #cfdcdf; background: #fff; border-radius: 9px; padding: 8px 6px; cursor: pointer; font-size: 12.5px; font-weight: 700; color: #2d454c; }
    .dtypes button[aria-pressed="true"] { background: var(--tq-soft); border-color: var(--tq); color: var(--tq-3); }
    .form .inp { width: 100%; }
    .form textarea.inp { height: 110px; padding: 6px 8px; font-family: Amiri, serif; font-size: 15px; }
    .form label { display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
  </style>
  <script src="js/core/logger.js?v=5.7.0"></script>
  <script>/* office.js blanks pages framed outside Office (PDF studio) — load it only when not embedded there */ if (!/[?&]embed=pdf\b/.test(location.search)) document.write('<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"><\/script>');</script>
  <script src="js/i18n.js?v=5.7.0"></script>
  <script src="js/core/render-host.js?v=5.7.0"></script>
  <script src="js/studio/raster.js?v=5.4.0"></script>
  <script src="js/figures/util.js?v=5.0.0"></script>
  <script src="js/figures/registry.js?v=5.0.0"></script>
  <script src="js/studio/studio.js?v=5.2.0"></script>
  <script src="vendor/nerdamer/all.min.js?v=1.1.13"></script>
  <script src="js/math/cas.js?v=5.0.0"></script>
  <script src="js/studio/vartable-render.js?v=5.0.0"></script>
  <script src="js/studio/diagram-render.js?v=5.0.0"></script>
</head>
<body class="studio">
  <div class="loader" id="loader">
    <svg class="arc" viewBox="0 0 120 120" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19b7b0"/><stop offset="1" stop-color="#0a7c78"/></linearGradient></defs>
      <path d="M22 70 A40 40 0 0 1 96 38" fill="none" stroke="url(#lg)" stroke-width="13" stroke-linecap="round"/>
    </svg>
    <div class="lt">جارٍ التحميل…</div>
  </div>
  <header class="st-bar">
    <div class="st-title"><span class="ico">▦</span><span data-t="الجداول والمخططات الرياضية|Math tables & diagrams"></span></div>
    <div class="st-tools"><button type="button" class="tb" id="exportBtn" title="تصدير">⇪</button></div>
  </header>
  <main class="st-main">
    <section class="st-canvas">
      <div class="stage" id="stage"></div>
      <div class="st-status" id="status"></div>
    </section>
    <aside class="st-side">
      <details class="st-sec" open>
        <summary data-t="النوع|Type"></summary>
        <div class="bd"><div class="dtypes" id="types">
          <button type="button" data-k="vartable" data-t="جدول التغيرات|Variation table"></button>
          <button type="button" data-k="signtable" data-t="جدول الإشارة|Sign table"></button>
          <button type="button" data-k="numberline" data-t="خط الأعداد (المتباينات)|Number line"></button>
          <button type="button" data-k="venn" data-t="أشكال فن (المجموعات)|Venn diagram"></button>
          <button type="button" data-k="tree" data-t="شجرة الاحتمالات|Probability tree"></button>
        </div></div>
      </details>
      <details class="st-sec" open>
        <summary data-t="البيانات|Input"></summary>
        <div class="bd form" id="form"></div>
      </details>
      <details class="st-sec" open>
        <summary data-t="الكود (LaTeX)|Code (LaTeX)"></summary>
        <div class="bd" id="codeBox"></div>
      </details>
    </aside>
  </main>
  <footer class="st-foot">
    <span class="size" id="sizeInfo"></span>
    <div class="foot-btns">
      <button type="button" class="btn ghost" id="cancelBtn" data-t="إلغاء|Cancel"></button>
      <button type="button" class="btn primary" id="okBtn" data-t="إدراج|Insert"></button>
    </div>
  </footer>
  <div class="pop" id="exportPop" hidden><div class="menu">
    <button type="button" data-exp="copy" data-t="نسخ كصورة|Copy image"></button>
    <button type="button" data-exp="png" data-t="تنزيل PNG|Download PNG"></button>
    <button type="button" data-exp="svg" data-t="تنزيل SVG|Download SVG"></button>
  </div></div>
  <div class="toast" id="toast" hidden></div>
  <script src="js/studio/diagram.js?v=5.0.0"></script>
</body>
</html>
