# Example: serve the add-in from https://math.example.com/
# 1) copy the contents of the "web" folder to /var/www/arabic-math
# 2) add this server block (or a location inside an existing HTTPS site), then: nginx -t && systemctl reload nginx
server {
    listen 443 ssl http2;
    server_name math.example.com;

    ssl_certificate     /etc/letsencrypt/live/math.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/math.example.com/privkey.pem;

    root /var/www/arabic-math;
    index taskpane.html;

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(woff2|png|js|css)$ {
        add_header Cache-Control "public, max-age=604800";
    }
}

# --- Or, inside an existing HTTPS site, under a sub-path (URL: https://your-site/arabic-math/):
