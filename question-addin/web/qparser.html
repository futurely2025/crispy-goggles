<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="qparser-assets/icons/icon-32.png">
  <title>محلل الأسئلة</title>
  <link rel="stylesheet" href="qparser-assets/css/qparser.css?v=1.0.0">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body class="q-page">
<!--QP_DATA-->
<div class="q-wrap">
  <div class="q-top">
    <h1>محلل <span>الأسئلة</span></h1>
  </div>

  <div class="q-hero">اسحب ملف Word (<b>.docx</b>) وأفلته هنا، أو اضغط «اختيار ملف». لا يُرفع الملف لأي مكان — كل شيء يتم على جهازك.</div>
  <div class="q-box">
    <label for="cat">اسم الامتحان (يُستخرج من اسم الملف — عدّله إن لزم)</label>
    <input type="text" id="cat" placeholder="مثال: الدور الثاني 2017 - 2016">
    <div class="q-row">
      <button class="qb" id="docBtn" type="button" hidden>📄 تحليل المستند المفتوح</button>
      <button class="qb s" id="fileBtn" type="button">📂 اختيار ملف Word (.docx)</button>
      <button class="qb o" id="pasteBtn" type="button">📋 لصق نص</button>
      <input type="file" id="file" accept=".docx" hidden>
    </div>
    <div id="pasteBox" hidden style="margin-top:8px">
      <textarea id="pasteTxt" placeholder="الصق الأسئلة هنا (س1) … الإجابة: … الشرح: … )"></textarea>
      <div class="q-row"><button class="qb" id="pasteGo" type="button">تحليل النص</button></div>
    </div>
    <div class="q-msg" id="msg"></div>
  </div>

  <div id="out" hidden>
    <div class="q-stats" id="stats"></div>
    <div class="q-box"><div class="q-dl" id="dl"></div></div>
    <div class="q-tabs" id="tabs"></div>
    <div id="panel"></div>
  </div>
</div>
<script src="qparser-assets/vendor/qparser-jszip.min.js"></script>
<script src="qparser-assets/js/qparser-core.js?v=1.0.0"></script>
<script src="qparser-assets/js/qparser-app.js?v=1.0.0"></script>
</body>
</html>
